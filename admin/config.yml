backend:
  name: github
  repo: metadata950-del/akoyaonline
  branch: main

media_folder: "uploads"
public_folder: "/uploads"
locale: "en"

collections:
  - name: "store"
    label: "Akoya Online"
    files:
      - name: "products"
        label: "پروڈکٹس (Products)"
        file: "data/products.json"
        fields:
          - label: "Products"
            name: "products"
            widget: "list"
            summary: "{{fields.slot}} — {{fields.name}}"
            fields:
              - { label: "جگہ نمبر (Slot / فولڈر نمبر)", name: "slot", widget: "number", value_type: "int", min: 1, max: 60, hint: "یہی نمبر کارڈ کی جگہ طے کرتا ہے۔ 1 = اوپر دائیں۔ ہر پروڈکٹ کا نمبر الگ ہو۔" }
              - { label: "نام", name: "name", widget: "string" }
              - { label: "تفصیل (دو لائنیں)", name: "description", widget: "text", required: false }
              - { label: "قیمت", name: "price", widget: "number", value_type: "int", min: 0, required: false }
              - { label: "تصویر", name: "image", widget: "image", required: false }

# ---- اختیاری: Sveltia کا اپنا تصویر چھوٹا کرنے کا نظام ----
